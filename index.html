<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Global Error Handler & Storage Polyfill for sandboxed iframes -->
    <script>
      (function() {
        try {
          var k = '__storage_test__';
          window.localStorage.setItem(k, k);
          window.localStorage.removeItem(k);
        } catch (e) {
          var createMemStorage = function() {
            var s = {};
            return {
              getItem: function(key) { return Object.prototype.hasOwnProperty.call(s, key) ? s[key] : null; },
              setItem: function(key, val) { s[key] = String(val); },
              removeItem: function(key) { delete s[key]; },
              clear: function() { s = {}; },
              key: function(i) { return Object.keys(s)[i] || null; },
              get length() { return Object.keys(s).length; }
            };
          };
          try {
            Object.defineProperty(window, 'localStorage', { value: createMemStorage(), writable: true, configurable: true });
            Object.defineProperty(window, 'sessionStorage', { value: createMemStorage(), writable: true, configurable: true });
          } catch (err) {}
        }

        // Global error suppressor for cross-origin third-party scripts (e.g. Disqus, Leaflet tiles, CDN assets)
        window.onerror = function(msg, url, lineNo, columnNo, error) {
          if (!msg || msg === 'Script error.' || (typeof msg === 'string' && (msg.indexOf('Script error') !== -1 || msg.indexOf('disqus') !== -1 || msg.indexOf('leaflet') !== -1))) {
            return true;
          }
          return false;
        };

        window.addEventListener('error', function(e) {
          if (!e) return;
          var msg = e.message || '';
          var src = (e.target && e.target.src) || (e.filename) || '';
          if (msg === 'Script error.' || msg.indexOf('Script error') !== -1 || src.indexOf('disqus') !== -1) {
            e.preventDefault && e.preventDefault();
            e.stopPropagation && e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason && (String(event.reason).indexOf('disqus') !== -1 || String(event.reason).indexOf('Script error') !== -1)) {
            if (event.preventDefault) event.preventDefault();
          }
        }, true);
      })();
    </script>
    <title>HDB Resale Tracker - Singapore Property Transacted Prices</title>
    <meta name="description" content="Explore real Singapore HDB resale transacted prices with interactive map, granular filters, and valuation analytics inspired by PropertyGuru and 99.co." />
    <meta property="og:title" content="Singapore HDB Resale Explorer" />
    <meta property="og:description" content="Search and analyze Singapore HDB resale transactions on map." />
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- Safe Clarity Stub to avoid cross-origin Script error in sandboxed iframes -->
    <script type="text/javascript">
      window.clarity = window.clarity || function() {
        (window.clarity.q = window.clarity.q || []).push(arguments);
      };
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
